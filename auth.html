<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeyForge Sign-in</title>
<meta name="theme-color" content="#07060e">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{--bg:#07060e;--panel:#100e1c;--line:#2a2548;--text:#ece9fa;--dim:#8f89b3;--cyan:#2ef2ff;--pink:#ff2e88;--bad:#ff4d6a;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% -10%,rgba(160,123,255,.18),transparent 60%),var(--bg);color:var(--text);font:15px/1.5 'Segoe UI',system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
  .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0;font:700 26px 'Bahnschrift','Segoe UI',sans-serif;letter-spacing:.14em}h1 b{color:var(--cyan)}
  p{margin:0;color:var(--dim)}
  button,.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:10px;font:600 15px 'Segoe UI',sans-serif;cursor:pointer;text-decoration:none}
  .g{background:#fff;color:#1f1f1f;border:0}.g svg{width:20px;height:20px}
  .go{background:rgba(46,242,255,.15);color:var(--cyan);border:1px solid var(--cyan)}
  .err{color:var(--bad);min-height:1.2em}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <h1>BEY<b>FORGE</b></h1>
  <div id="step1"><p>Sign in with Google to connect your account to the BeyForge app.</p></div>
  <button class="g" id="gBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.4l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.6 2.2 2.2 6.6 2.2 12s4.4 9.8 9.8 9.8c5.7 0 9.4-4 9.4-9.6 0-.6-.1-1.1-.2-1.6H12z"/></svg>Continue with Google</button>
  <div id="step2" hidden><p>Signed in. Heading back to BeyForge…</p><a class="go" id="back" href="#">Open BeyForge</a><p style="font-size:13px">If nothing happens, tap the button above. You can close this tab after.</p></div>
  <div class="err" id="err"></div>
</main>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  firebase.initializeApp(window.BF_FIREBASE);
  const auth=firebase.auth(), err=document.getElementById('err');
  async function go(){
    err.textContent='';
    try{
      const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      const res=await auth.signInWithPopup(p);
      const tok=res.credential&&res.credential.idToken;
      if(!tok) throw new Error('Google didn’t return a sign-in token. Try again.');
      const link='beyforge://auth?id_token='+encodeURIComponent(tok);
      document.getElementById('back').href=link;
      document.getElementById('gBtn').hidden=true; document.getElementById('step1').hidden=true; document.getElementById('step2').hidden=false;
      location.href=link;
      auth.signOut();
    }catch(e){ err.textContent = e.code==='auth/popup-blocked' ? 'Your browser blocked the Google window — allow popups and tap again.' : (e.message||String(e)); }
  }
  document.getElementById('gBtn').onclick=go;
</script>
</body>
</html>
