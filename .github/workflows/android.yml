name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Stage web app
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest css js lib icons www/

      - name: Create Capacitor Android project
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cat > capacitor.config.json <<'JSON'
          { "appId": "com.battlebornplayz.beyforge", "appName": "BeyForge", "webDir": "www",
            "android": { "backgroundColor": "#07060e" } }
          JSON
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          cp -r android-res/* android/app/src/main/res/
          f=android/app/src/main/res/values/ic_launcher_background.xml
          [ -f "$f" ] && sed -i 's/#FFFFFF/#07060E/I' "$f" || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BeyForge.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BeyForge (latest build)
          body: |
            Install on Android: download **BeyForge.apk**, open it, and allow "install unknown apps" for your browser when asked.
            Built from ${{ github.sha }}.
          files: BeyForge.apk
          make_latest: true
          prerelease: false
