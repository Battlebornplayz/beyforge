name: Publish Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/rules.yml]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for key
        id: key
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: if [ -n "$SA" ]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT secret to publish rules automatically"; fi
      - name: Deploy rules
        if: steps.key.outputs.ok == '1'
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13.29.1 deploy --only firestore:rules --project beyforge-a6bcc --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
